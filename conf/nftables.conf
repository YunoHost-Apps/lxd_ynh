#!/usr/sbin/nft -f

# YunoHost's firewall drops everything on input, including the traffic the
# containers send to the host. The set is filled by lxd-network-sync.

table inet filter {
    set lxd_bridges {
        type ifname
        comment "Bridges managed by LXD"
    }

    chain input {
        iifname @lxd_bridges udp dport 67 counter accept comment "LXD DHCP"
        iifname @lxd_bridges udp dport 547 counter accept comment "LXD DHCPv6"
        iifname @lxd_bridges tcp dport 53 counter accept comment "LXD DNS"
        iifname @lxd_bridges udp dport 53 counter accept comment "LXD DNS"
    }
}
